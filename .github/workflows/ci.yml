name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings -D clippy::unwrap_used

      - name: Test
        run: cargo test

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

      - name: Install sqlx-cli
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: sqlx-cli

      - name: Sqlx offline metadata check
        run: |
          sqlx database create --database-url sqlite:ci.db?mode=rwc
          sqlx migrate run --database-url sqlite:ci.db?mode=rwc
          cargo sqlx prepare --check --database-url sqlite:ci.db?mode=rwc
