<style>
    :root {
        --bg: #162033;
        --raised: #1e2a40;
        --rule: #2b3953;
        --ink: #e8e4d8;
        --muted: #8b96aa;
        --ok: #8fbf8a;
        --missed: #e5626b;
        --paused: #d1a85a;
        --link: #a9c1e8;
        --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
    }
    /* Light palette: chosen explicitly via the toggle, or by the OS unless dark was chosen. */
    :root[data-theme="light"] {
        --bg: #eef1f5;
        --raised: #e2e7ee;
        --rule: #cdd5e0;
        --ink: #162033;
        --muted: #56627a;
        --ok: #3f7a3b;
        --missed: #b8323e;
        --paused: #8c6418;
        --link: #2b4f8a;
        color-scheme: light;
    }
    @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
            --bg: #eef1f5;
            --raised: #e2e7ee;
            --rule: #cdd5e0;
            --ink: #162033;
            --muted: #56627a;
            --ok: #3f7a3b;
            --missed: #b8323e;
            --paused: #8c6418;
            --link: #2b4f8a;
            color-scheme: light;
        }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--bg);
        color: var(--ink);
        font: 400 1rem/1.5 var(--sans);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
    }
    main { max-width: 56rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
    code { font: 0.875em var(--mono); color: var(--muted); }

    .masthead {
        display: flex; justify-content: space-between; align-items: baseline;
        flex-wrap: wrap; gap: 0.25rem 1rem;
        padding-bottom: 2.5rem;
        font-size: 0.875rem; color: var(--muted);
    }
    .wordmark { font: 600 1rem var(--serif); color: var(--ink); letter-spacing: 0.02em; }
    .masthead-end { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; }
    .theme-toggle {
        font: inherit; color: var(--link);
        background: none; border: 0; padding: 0; cursor: pointer;
    }
    .theme-toggle:hover { text-decoration: underline; }
    .theme-toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }

    /* The one loud element: a sentence that answers "is anything broken?" */
    .verdict {
        font: 500 clamp(1.75rem, 4.5vw, 2.75rem)/1.15 var(--serif);
        letter-spacing: -0.01em;
        max-width: 22ch;
        padding-left: 1rem;
        border-left: 6px solid var(--ok);
    }
    .verdict.tone-missed { border-color: var(--missed); }
    .verdict.tone-paused, .verdict.tone-empty { border-color: var(--paused); }
    .lede { margin: 0.75rem 0 2.5rem 1.375rem; color: var(--muted); max-width: 60ch; }

    .monitors { list-style: none; border-top: 1px solid var(--rule); }
    .row { border-bottom: 1px solid var(--rule); }
    .row-link {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 7.5rem 12rem;
        gap: 0.25rem 1.5rem; align-items: baseline;
        padding: 0.875rem 0.75rem 0.875rem 1rem;
        border-left: 4px solid var(--strip);
        color: inherit;
    }
    .row-link:hover { background: var(--raised); text-decoration: none; }
    .row-link:hover .name { text-decoration: underline; }
    .status-active { --strip: var(--ok); }
    .status-missed { --strip: var(--missed); }
    .status-paused { --strip: var(--paused); }
    .status-missed .row-link { background: color-mix(in srgb, var(--missed) 8%, transparent); }

    .row-main { display: flex; flex-direction: column; min-width: 0; }
    .name { font-weight: 600; overflow-wrap: anywhere; }
    .schedule { font-size: 0.875rem; color: var(--muted); }
    .state { font-size: 0.875rem; font-weight: 600; color: var(--strip); }
    .times { display: flex; flex-direction: column; font-size: 0.875rem; color: var(--muted); }
    .status-paused .name { color: var(--muted); }

    @media (max-width: 40rem) {
        .row-link { grid-template-columns: minmax(0, 1fr) auto; }
        .times { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 0 1rem; }
    }

    /* Detail page */
    .back { display: inline-block; }
    .masthead-detail { padding-bottom: 1.5rem; }
    .facts {
        display: grid; grid-template-columns: max-content minmax(0, 1fr);
        gap: 0.5rem 2rem; margin: 2rem 0 3rem 1.375rem;
    }
    .facts dt { color: var(--muted); }
    .facts dd { overflow-wrap: anywhere; }
    h2 { font: 500 1.375rem/1.3 var(--serif); margin-bottom: 1rem; }
    .history { list-style: none; border-top: 1px solid var(--rule); }
    .history li {
        border-bottom: 1px solid var(--rule);
        border-left: 4px solid var(--strip);
        padding: 0.75rem 0.75rem 0.75rem 1rem;
    }
    .outcome-success { --strip: var(--ok); }
    .outcome-failure { --strip: var(--missed); }
    .history .head { display: flex; flex-wrap: wrap; gap: 0 1rem; align-items: baseline; }
    .history .outcome { font-weight: 600; color: var(--strip); text-transform: capitalize; }
    .history time { font-size: 0.875rem; color: var(--muted); }
    .history pre {
        margin-top: 0.5rem; padding: 0.5rem 0.75rem;
        background: var(--raised); border-radius: 3px;
        font: 0.8125rem/1.5 var(--mono);
        white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: 16rem; overflow: auto;
    }
    .empty { color: var(--muted); }
</style>
