name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            artifact: shikigami-x86_64-linux
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            artifact: shikigami-aarch64-linux

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release

      - name: Package binary + checksum
        run: |
          strip target/release/shikigami
          tar czf ${{ matrix.artifact }}.tar.gz -C target/release shikigami
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: shikigami-*
          merge-multiple: true

      - name: Extract changelog
        run: |
          ver="${TAG_NAME#v}"
          # Extract version section from CHANGELOG.md (## [0.4.1] ... up to next ##)
          awk -v ver="$ver" '
            /^## \[/{ section=$0; gsub(/^## \[|\].*/, "", section); found=(section==ver); next }
            found
          ' CHANGELOG.md > RELEASE_BODY.md

      - name: Release
        run: |
          gh release create "$TAG_NAME" *.tar.gz *.tar.gz.sha256 install.sh \
            --repo "$REPO" \
            --title "$TAG_NAME" \
            --notes-file RELEASE_BODY.md \
            --verify-tag

  # Build and push a per-arch container image on each native runner, then merge
  # the two arch images into a single multi-arch manifest. Independent of
  # `build`/`create-release` (best-effort image): a flaky image build does not
  # block the tarball release, and a failed `manifest` job can be re-run without
  # re-tagging.
  docker:
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version (strip leading v)
        id: ver
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}

  manifest:
    name: docker manifest
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version (strip leading v)
        id: ver
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Merge arch images into a multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}-arm64
